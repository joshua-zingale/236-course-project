<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Viewer</title>
</head>
<body>
    <h1>Data Viewer</h1>
    <db-relation style="width: 70%; margin: auto;"></db-relation>

    <script src="/static/js/db_api.js"></script>
    <script src="/static/js/components.js"></script>
    <script>
        const relation = document.querySelector("db-relation");
        relation.query = {
            "table":"unified_reservations",
            "columns":["arrival_time", "canceled", "email"],
            "constraints": [{"operator": ">", "column":"arrival_time","argument": "2016-01-01"}],
            "limit": 100,
            "offset": 0,
            "order":[{"column": "arrival_time"}]};
    </script>
</body>
</html>
